name: Automation & CI Workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'رابط الصفحة المستهدفة (URL) — اتركه فارغًا لتشغيل اختبار النموذج المحلي'
        required: false
        type: string
      phone_numbers:
        description: 'أرقام الهواتف (أو اتركها فارغة للقراءة من ملف phones.txt في المستودع الذي يسع لأكثر من 300 رقم كل رقم بسطر)'
        required: false
        type: string
      sync_all_lamix:
        description: 'جلب كل الأرقام من Lamix بالكامل (اتركه معطلاً لجلب الأحدث فقط في كل تشغيل)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-automation-and-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Sync numbers from Lamix API
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          LAMIX: ${{ secrets.LAMIX }}
          LAMIX_FETCH_ALL: ${{ inputs.sync_all_lamix }}
        run: |
          npx tsx server/fetch-lamix.ts
          if [ -n "$(git status --porcelain phones.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add phones.txt
            git commit -m "Sync phone numbers from Lamix API [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "phones.txt is already up to date."
          fi

      - name: Run Playwright automation for provided URL and numbers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url != '' }}
        env:
          TARGET_URL: ${{ inputs.target_url }}
          PHONE_NUMBERS: ${{ inputs.phone_numbers }}
        run: node server/run-workflow.ts

      - name: Run end-to-end Playwright automation check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_url == '' }}
        run: |
          NODE_ENV=production node server.ts &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/test-form > /dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module -e '
            import assert from "node:assert/strict";
            const res = await fetch("http://localhost:3000/api/automate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                url: "http://localhost:3000/test-form",
                phones: "+966501234567\n+966501234567\nfail-123\n+966559876543",
                delayMs: 0
              })
            });
            assert.equal(res.status, 200);
            const text = await res.text();
            const events = text.trim().split("\n").map((line) => JSON.parse(line));
            const results = events.filter((e) => e.type === "result");
            assert.equal(results.length, 3, "Should process 3 unique numbers without duplicates");
            assert.equal(results[0].status, "success");
            assert.equal(results[1].status, "failed");
            assert.equal(results[2].status, "success");
            console.log("E2E Playwright automation verification passed:", results.map((r) => ({ phone: r.phone, status: r.status })));

            const countryRes = await fetch("http://localhost:3000/api/automate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                url: "http://localhost:3000/test-form-country",
                phones: "+201223189009\n+966501234567",
                delayMs: 0
              })
            });
            assert.equal(countryRes.status, 200);
            const countryText = await countryRes.text();
            const countryResults = countryText.trim().split("\n").map((line) => JSON.parse(line)).filter((e) => e.type === "result");
            assert.equal(countryResults.length, 2);
            assert.equal(countryResults[0].status, "success");
            assert.ok(countryResults[0].details.includes("+20") && countryResults[0].details.includes("1223189009"));
            assert.equal(countryResults[1].status, "success");
            assert.ok(countryResults[1].details.includes("+966") && countryResults[1].details.includes("501234567"));
            console.log("Country-code E2E verification passed:", countryResults.map((r) => ({ phone: r.phone, details: r.details })));

            const loginRes = await fetch("http://localhost:3000/api/automate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                url: "http://localhost:3000/test-form-login",
                phones: "+201208546652",
                delayMs: 0
              })
            });
            assert.equal(loginRes.status, 200);
            const loginText = await loginRes.text();
            const loginResults = loginText.trim().split("\n").map((line) => JSON.parse(line)).filter((e) => e.type === "result");
            assert.equal(loginResults.length, 1);
            assert.equal(loginResults[0].status, "success");
            assert.ok(loginResults[0].details.includes("تم تسجيل الدخول بالرقم"));
            console.log("Login button E2E verification passed:", loginResults.map((r) => ({ phone: r.phone, details: r.details })));
          '
